<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <script src="js/jquery-2.1.3.min.js"></script>
    <link rel="stylesheet" href="css/sample.css">
    <title>じゃんけん</title>
</head>

<body>

    <header>
        <h1>じゃんけん</h1>
    </header>

    <main>
        <ul>
            <li id="gu_btn">グー</li>
            <li id="cho_btn">チョキ</li>
            <li id="par_btn">パー</li>
        </ul>
        <div>コンピュータの出した手は？「<span id="pc_hands">なに？</span>」</div>
        <div id="judgment">勝ち</div>
    </main>

    <footer></footer>
    <script>
        $("#gu_btn").on("click", function(){
            const pc_hands = Math.ceil(Math.random()*3);
            if(pc_hands==1){
                $("#pc_hands").text("グー");
                $("#judgment").text("あいこ");
            }
            else if (pc_hands==2){
                $("#pc_hands").text("チョキ");
                $("#judgment").text("あなたの勝ち");
            }

            else {
                $("#pc_hands").text("パー");
                $("#judgment").text("あなたの負け");
            }
        })

        $("#cho_btn").on("click", function(){
            const pc_hands = Math.ceil(Math.random()*3);
            if(pc_hands==1){
                $("#pc_hands").text("グー");
                $("#judgment").text("あなたの負け");
            }
            else if (pc_hands==2){
                $("#pc_hands").text("チョキ");
                $("#judgment").text("あいこ");
            }

            else {
                $("#pc_hands").text("パー");
                $("#judgment").text("あなたの勝ち");
            }
        })

        $("#par_btn").on("click", function(){
            const pc_hands = Math.ceil(Math.random()*3);
            if(pc_hands==1){
                $("#pc_hands").text("グー");
                $("#judgment").text("あなたの勝ち");
            }
            else if (pc_hands==2){
                $("#pc_hands").text("チョキ");
                $("#judgment").text("あなたの負け");
            }

            else {
                $("#pc_hands").text("パー");
                $("#judgment").text("あいこ");
            }
        })
        let pc_hands;


    
    </script>
</body>

</html>
