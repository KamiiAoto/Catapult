            <li class="blue-text">キルア</li>

    <div>
        <h2>aタグ</h2>
        <ul>
            <li><a href="https://www.google.com/" target="_blank">Google</a></li>
            <li><a href="./test.html">test.html</a></li>
        </ul>
    </div>

    <div>
        <img src="https://www.google.com/images/branding/google_wordmark/v1/2x/googlelogo_color_272x92dp.png" alt="ロゴ画像">

    <div>
        <img src="./googlelogo_color_272x92dp.png" alt="ロゴ画像">
